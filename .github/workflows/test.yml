name: "Tests"
on:
    push:
        branches: ["latest"]
        paths:
            - src/**
            - tests/**
            - android/**
            - examples/**
            - Cargo.toml
            - Cargo.lock
            - .rustfmt.toml
            - .github/workflows/test.yml
    pull_request:
        branches: ["latest"]
    workflow_dispatch:
permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    test:
        name: test
        runs-on: ubuntu-latest
        # Scoped to this job, which is the only one that installs the wrapper.
        # The feature-matrix job compiles as well and would benefit; wiring it
        # up there is a separate change.
        env:
            SCCACHE_GHA_ENABLED: "true"
            RUSTC_WRAPPER: "sccache"
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: sccache-cache
              uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

            - name: Install Rust toolchain
              uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
              with:
                  cache-directories: |
                      ~/.cargo/registry
                      ~/.cargo/bin
                      target

            # Pinned and checksummed. `latest` fetched an unverified binary and
            # ran it on every cache miss, so the version CI tested with could
            # change without a commit. The digest is the one published beside
            # the release; bump the two together.
            - name: Install cargo-nextest
              shell: bash
              env:
                  NEXTEST_VERSION: "0.9.143"
                  NEXTEST_SHA256: "66786b9abe23920d022a182d1416b1bbc8130dd4872a9553d76985a1708dcd1e"
              run: |
                  set -euo pipefail
                  if command -v cargo-nextest >/dev/null 2>&1; then
                      echo "cargo-nextest is already installed; leaving it alone"
                      exit 0
                  fi
                  base="https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION"
                  archive="cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz"
                  curl -sSfL -o nextest.tgz "$base/$archive"
                  echo "$NEXTEST_SHA256  nextest.tgz" | sha256sum -c -
                  tar xzf nextest.tgz
                  mv cargo-nextest "$HOME/.cargo/bin/"

            - name: run the tests
              run: cargo nextest run --locked --all-targets --all-features --future-incompat-report

            # nextest does not run doctests, and every public item in this
            # crate carries one. Without this step a broken example ships green.
            - name: run the doctests
              run: cargo test --locked --doc --all-features

            - name: consult Clippy
              run: cargo clippy --locked --all-targets --all-features -- -D warnings

            # Catches ambiguous and broken intra-doc links, which neither the
            # tests nor Clippy see.
            - name: build the docs
              env:
                  RUSTDOCFLAGS: "-D warnings"
              run: cargo doc --locked --no-deps --all-features

    features:
        name: feature matrix
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Install Rust toolchain
              uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

            # `--all-features` is not enough on its own: the top-level Oblique
            # functions and the voice tests are feature-gated, so a deck that
            # only compiles alongside its neighbours would pass the test job.
            # One runner over all eight is cheaper than eight matrix jobs and
            # reuses the same warm target directory.
            - name: every deck builds alone
              shell: bash
              env:
                  RUSTFLAGS: "-D warnings"
              run: |
                  for deck in oblique examen constraints absurd attention memento dramatis stuck; do
                      echo "::group::$deck"
                      cargo check --locked --no-default-features --features "$deck" --all-targets
                      echo "::endgroup::"
                  done

            # The crate promises this failure by name; see the `compile_error!`
            # at the crate root.
            # The JNI shim is a workspace member and is not covered by the
            # jobs above, which build the library alone. `cargo check` does not
            # link, so this needs the Rust target and no NDK -- cheap, and it
            # stops the shim rotting when the library's API moves.
            - name: the Android JNI shim still compiles
              run: |
                  rustup target add aarch64-linux-android
                  cargo check --locked -p sortes-jni --target aarch64-linux-android

            # The shim's record format is what the Kotlin side splits on, and
            # its tests are plain Rust over the library: they need the host, not
            # a device. `default-members` keeps them out of the test job above,
            # so they are asked for by name here.
            - name: the shim's record format still round-trips
              run: cargo test --locked -p sortes-jni

            - name: a build with no deck fails, and says why
              shell: bash
              run: |
                  if cargo check --locked --no-default-features 2>build.log; then
                      echo "a featureless build succeeded; it must not" >&2
                      exit 1
                  fi
                  cat build.log
                  grep -q "at least one deck feature must be enabled" build.log

    android:
        name: android app
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Install Rust toolchain
              uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
              with:
                  target: aarch64-linux-android

            # No third-party action for the SDK or the JDK: the ubuntu runner
            # ships both, and every action in this repo carries a verified SHA,
            # which is a cost worth paying only for something the image lacks.
            # `local.properties` is not committed, so the build falls back to
            # ANDROID_HOME, which the image sets.
            - name: assemble the debug APK
              shell: bash
              run: |
                  set -euo pipefail
                  export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:?the runner image should provide an NDK}"
                  ./android/gradlew -p android assembleDebug --no-daemon --console=plain

            # The debug build does not shrink, so it cannot show a missing keep
            # rule. R8 renames the `Native` methods that JNI matches by name,
            # and that failure is silent at build time and fatal on the device,
            # so the release build is the one that proves proguard-rules.pro.
            # Unsigned here; no keystore reaches CI.
            # Neither needs a device: the decoding and the shoe are plain
            # Kotlin, which is why Native.kt splits each native call from the
            # parsing around it and CardShoe takes its shuffle as a function.
            - name: the app's unit tests, and lint
              shell: bash
              run: |
                  set -euo pipefail
                  export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:?the runner image should provide an NDK}"
                  ./android/gradlew -p android testDebugUnitTest lintDebug --no-daemon --console=plain

            - name: assemble the release APK, which is what runs R8
              shell: bash
              run: |
                  set -euo pipefail
                  export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:?the runner image should provide an NDK}"
                  ./android/gradlew -p android assembleRelease --no-daemon --console=plain

            # The JNI methods surviving R8 is the property that matters, and
            # it currently holds because of a default AGP supplies rather than
            # anything in this repo -- so check the outcome, not the rule. This
            # catches AGP dropping that default, a switch to a different default
            # file, or a keep rule that stops matching, all of which are silent
            # at build time and fatal on the device. mapping.txt is no use: R8
            # omits identity mappings, so a method kept and not renamed does not
            # appear in it at all. Read the shipped DEX instead.
            - name: the JNI methods survived R8
              shell: bash
              run: |
                  set -euo pipefail
                  apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
                  test -f "$apk" || { echo "no release APK to inspect" >&2; exit 1; }
                  dexdump=$(find "${ANDROID_HOME:?}/build-tools" -type f -name 'dexdump*' | sort -V | tail -1)
                  test -n "$dexdump" || { echo "no dexdump in the SDK build-tools" >&2; exit 1; }

                  work=$(mktemp -d)
                  unzip -q -o "$apk" 'classes*.dex' -d "$work"
                  "$dexdump" -d "$work"/classes*.dex > "$work/dump.txt"

                  # Only the Native class's own section is searched, so a name
                  # occurring elsewhere in the DEX cannot make this pass by
                  # accident.
                  line=$(grep -nF "Class descriptor  : 'Ldev/feridottir/sortes/Native;'" "$work/dump.txt" | head -1 | cut -d: -f1)
                  test -n "$line" || { echo "R8 dropped or renamed the Native class" >&2; exit 1; }
                  section=$(tail -n "+$line" "$work/dump.txt" | sed -n '1,/source_file_idx/p')

                  for method in decks draw; do
                      echo "$section" | grep -qF "name          : '$method'" || { echo "R8 dropped or renamed Native.$method" >&2; exit 1; }
                  done
                  echo "Native.decks and Native.draw survived R8"

    fmt:
        name: formatting check
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Install nightly Rust
              uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
              with:
                  toolchain: nightly
                  components: rustfmt

            - name: check formatting
              run: cargo +nightly fmt --check --all
