org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# `android.useAndroidX` is absent on purpose: the app uses no AndroidX at all —
# platform views, platform theme — and the flag is deprecated in AGP 9 anyway,
# so it is left at its default rather than set to false.
#
# Non-transitive R classes mean `R` holds this module's own resources and not
# its dependencies'. It is the AGP default and is stated here so that a build
# reading only this file gets the same answer as one reading AGP's.
android.nonTransitiveRClass=true
