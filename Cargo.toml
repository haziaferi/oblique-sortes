[package]
# Published as `oblique-decks`; upstream holds `oblique` on crates.io. The
# library keeps the shorter name below, so callers still write `oblique::`.
name = "oblique-decks"
version = "0.2.0"
edition = "2024"
description = "Eight decks of cards for when the work is stuck: Oblique Strategies and seven more."
readme = "README.md"
license = "ISC"
authors = ["feridottir <feridottir@proton.me>"]
rust-version = "1.85"
keywords = ["oblique-strategies", "creativity", "prompts", "cards", "random"]
categories = ["command-line-utilities"]

[lib]
name = "oblique"
path = "src/lib.rs"

[[bin]]
name = "oblique"
path = "src/bin/oblique.rs"

[features]
default = ["oblique"]
# One feature per deck. Decks are compile-time constants, so a consumer who
# enables only the decks they want pays nothing for the rest.
oblique = []
examen = []
constraints = []
absurd = []
attention = []
memento = []
dramatis = []
stuck = []
# Every deck.
full = ["oblique", "examen", "constraints", "absurd", "attention", "memento", "dramatis", "stuck"]

[dependencies]
fastrand = "2.4"

[lints.rust]
unsafe_code = { level = "deny", priority = 0 }
future_incompatible = { level = "deny", priority = 1 }
rust_2018_idioms = { level = "warn", priority = 2 }
trivial_casts = { level = "warn", priority = 3 }
trivial_numeric_casts = { level = "warn", priority = 4 }
unused_lifetimes = { level = "warn", priority = 5 }
unused_qualifications = { level = "warn", priority = 6 }

[lints.clippy]
unwrap_used = "deny"

[profile.release]
lto = true        # Enable full link-time optimization
codegen-units = 1 # Single codegen unit for better optimization
opt-level = 3     # Maximum optimization
strip = true      # Strip symbols for smaller binary
panic = "abort"   # Smaller binary, no unwinding
